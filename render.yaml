services:
  - type: web
    name: venture-map
    runtime: node
    rootDir: venture-map
    branch: claude/optimistic-hawking-uhyds9
    plan: starter
    buildCommand: echo ok
    startCommand: node server.js
    healthCheckPath: /healthz
    disk:
      name: venture-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /data
      - key: APP_PASSWORD
        sync: false
