<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>창업 단계 지도</title>
<style>
:root{--bg:#f5f8f7;--fg:#17201e;--muted:#566561;--card:#fff;--line:#cfdad6;--brand:#126b57;--brand-fg:#fff;--ok:#17643c;--okbg:#dff5e8;--no:#9b2c20;--nobg:#fbe4e0;--un:#4a5560;--unbg:#e8ecef;--now:#1d4f91;--nowbg:#dfeefe}
@media(prefers-color-scheme:dark){:root{--bg:#10171a;--fg:#e8efed;--muted:#a3b2ae;--card:#182226;--line:#2f3f44;--brand:#4cc2a3;--brand-fg:#0b1512;--ok:#7fe0a8;--okbg:#17372a;--no:#ff9a8c;--nobg:#42201b;--un:#b8c4cc;--unbg:#26323a;--now:#8cbcff;--nowbg:#1b2f4a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif}
a,button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--now);outline-offset:2px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}
header.top h1{font-size:1.15rem;margin:0 12px 0 0}
label{font-weight:700}
select,input[type=text],input[type=date],textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
textarea{width:100%;min-height:84px}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer}
button.primary{background:var(--brand);color:var(--brand-fg);border-color:var(--brand);font-weight:700}
button[aria-pressed=true]{background:var(--brand);color:var(--brand-fg);border-color:var(--brand);font-weight:700}
button.danger{color:var(--no)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main{max-width:1280px;margin:0 auto;padding:18px 20px 60px}
.summary{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--brand);border-radius:10px;padding:14px 18px;margin-bottom:16px}
.summary p{margin:4px 0}
nav.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.map{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.col.now{border:2px solid var(--now);background:linear-gradient(var(--nowbg),var(--card) 90px)}
.col h3{margin:0;font-size:1rem}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:700;border:1px solid currentColor}
.b-now{color:var(--now)}.b-ok{color:var(--ok)}.b-no{color:var(--no)}.b-un{color:var(--un)}
.bar{height:8px;border-radius:6px;background:var(--unbg);overflow:hidden}.bar>i{display:block;height:100%;background:var(--brand)}
.hcard{display:block;text-align:left;width:100%;border-radius:8px;padding:8px 10px;border:1px solid var(--line);background:var(--card);font-size:.9rem}
.hcard.supported{border-left:6px solid var(--ok)}.hcard.rejected{border-left:6px solid var(--no);text-decoration:line-through;opacity:.8}.hcard.unverified{border-left:6px dashed var(--un)}
.foot{color:var(--muted);font-size:.85rem;margin-top:auto}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.item h3{margin:0 0 6px;font-size:1rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0}
form.add{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin:12px 0}
form.add .row>*{flex:0 1 auto}
fieldset{border:1px solid var(--line);border-radius:8px;margin:6px 0}
.muted{color:var(--muted)}
ul.plain{margin:4px 0;padding-left:20px}
@media(max-width:700px){.map{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <h1>창업 단계 지도</h1>
  <label for="proj">프로젝트</label>
  <select id="proj"></select>
  <button id="btn-new">템플릿에서 새로 만들기</button>
  <button id="btn-clone">이 프로젝트 복제</button>
  <span id="saved" role="status" aria-live="polite" class="muted"></span>
</header>
<main id="app" aria-live="off"></main>

<script>
const WHO = ["본인 관찰","작업장 관계자","소비자","공무원·기관","문서·자료","기타"];
const STATUS = {unverified:["미검증","○","b-un"],supported:["지지됨","✓","b-ok"],rejected:["기각됨","✕","b-no"]};
let list = [], pid = null, P = null, view = "map", focusId = null, saveTimer = null;
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uid = (p) => p + Math.random().toString(36).slice(2, 8);
const today = () => new Date(Date.now() + 9 * 36e5).toISOString().slice(0, 10);
const api = async (url, opt) => { const r = await fetch(url, opt); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status); return r.json(); };

async function loadList(selectId) {
  list = await api("/api/projects");
  const sel = $("#proj");
  sel.innerHTML = list.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}${p.isTemplate ? " (템플릿)" : ""}</option>`).join("");
  pid = selectId || pid || (list.find((p) => !p.isTemplate) || list[0]).id;
  sel.value = pid;
  P = await api("/api/projects/" + pid);
  render();
}
function save() {
  clearTimeout(saveTimer); $("#saved").textContent = "저장 중…";
  saveTimer = setTimeout(async () => {
    try { await api("/api/projects/" + pid, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(P) }); $("#saved").textContent = "저장됨"; }
    catch (e) { $("#saved").textContent = "저장 실패: " + e.message; }
  }, 250);
}
const stageIdx = (id) => P.stages.findIndex((s) => s.id === id);
const stageName = (id) => { const i = stageIdx(id); return i < 0 ? "" : `${i + 1}단계 ${P.stages[i].name}`; };
const evOf = (h) => P.evidence.filter((e) => (e.hypothesisIds || []).includes(h.id));
const exitCount = (s) => [s.exit.filter((e) => e.done).length, s.exit.length];

function summary() {
  const s = P.stages[stageIdx(P.currentStage)] || P.stages[0], i = stageIdx(s.id), [d, t] = exitCount(s);
  const noEv = P.hypotheses.filter((h) => !evOf(h).length).length;
  const nextTodo = s.exit.find((e) => !e.done);
  return `<section class="summary" aria-label="현재 요약">
    <p><strong>지금은 ${i + 1}단계 「${esc(s.name)}」입니다.</strong> 졸업 조건 ${t}개 중 ${d}개 완료.</p>
    <p>가설 ${P.hypotheses.length}개 중 근거(증거)가 없는 가설 ${noEv}개. 인터뷰·증거 ${P.evidence.length}건, 결정 ${P.decisions.length}건.</p>
    <p>${nextTodo ? "다음 할 일: " + esc(nextTodo.text) : "이 단계의 조건을 모두 마쳤습니다. 다음 단계로 넘어갈 수 있습니다."}</p></section>`;
}
function mapView() {
  return `<h2 class="sr-only">단계 지도</h2><div class="map">` + P.stages.map((s, i) => {
    const [d, t] = exitCount(s), hs = P.hypotheses.filter((h) => h.stageId === s.id);
    const ev = new Set(); hs.forEach((h) => evOf(h).forEach((e) => ev.add(e.id)));
    const ds = P.decisions.filter((x) => x.stageId === s.id).length, cur = s.id === P.currentStage;
    return `<section class="col ${cur ? "now" : ""}" aria-labelledby="c-${s.id}">
      <h3 id="c-${s.id}">${i + 1}. ${esc(s.name)} ${cur ? '<span class="badge b-now">현재</span>' : ""}</h3>
      <div class="muted">${esc(s.goal)}</div>
      <div><span>졸업 조건 ${d}/${t}</span><div class="bar" aria-hidden="true"><i style="width:${t ? d / t * 100 : 0}%"></i></div></div>
      ${hs.map((h) => `<button class="hcard ${h.status}" data-goto="${h.id}"><span class="badge ${STATUS[h.status][2]}">${STATUS[h.status][1]} ${STATUS[h.status][0]}</span> ${esc(h.text)} <span class="muted">· 증거 ${evOf(h).length}건</span></button>`).join("") || '<span class="muted">가설 없음</span>'}
      <div class="foot">가설 ${hs.length} · 증거 ${ev.size} · 결정 ${ds}</div></section>`;
  }).join("") + `</div>` + (() => { const n = P.evidence.filter((e) => !(e.hypothesisIds || []).length).length; return n ? `<p class="muted">가설에 연결되지 않은 증거 ${n}건 (인터뷰·증거 탭에서 연결하세요)</p>` : ""; })();
}
function outlineView() {
  return `<h2>개요 (낭독용 목록)</h2><p class="muted">지도와 같은 내용을 위에서 아래로 읽는 순서로 보여줍니다.</p>` + P.stages.map((s, i) => {
    const [d, t] = exitCount(s), hs = P.hypotheses.filter((h) => h.stageId === s.id);
    return `<section class="item" aria-labelledby="o-${s.id}"><h3 id="o-${s.id}">${i + 1}단계 ${esc(s.name)}${s.id === P.currentStage ? " (현재 단계)" : ""}</h3>
      <p>${esc(s.goal)} 졸업 조건 ${t}개 중 ${d}개 완료.</p>
      <ul class="plain">${s.exit.map((e) => `<li>${e.done ? "완료" : "남음"}: ${esc(e.text)}</li>`).join("")}</ul>
      ${hs.length ? `<p><strong>가설 ${hs.length}개</strong></p><ul class="plain">${hs.map((h) => `<li>${STATUS[h.status][0]}: ${esc(h.text)} (증거 ${evOf(h).length}건)</li>`).join("")}</ul>` : '<p class="muted">이 단계의 가설 없음</p>'}</section>`;
  }).join("");
}
const stageOpts = (sel) => P.stages.map((s, i) => `<option value="${s.id}" ${s.id === sel ? "selected" : ""}>${i + 1}단계 ${esc(s.name)}</option>`).join("");
const statusOpts = (sel) => Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === sel ? "selected" : ""}>${v[0]}</option>`).join("");
function hypView() {
  return `<h2>가설</h2>
  <form class="add" id="f-hyp" aria-label="가설 추가"><div class="row"><label for="h-text">새 가설 (한 문장)</label></div><textarea id="h-text" required></textarea>
    <div class="row"><label for="h-stage">단계</label><select id="h-stage">${stageOpts(P.currentStage)}</select><button class="primary">가설 추가</button></div></form>` +
    P.hypotheses.map((h) => `<article class="item" id="h-${h.id}" tabindex="-1"><h3>${esc(h.text)}</h3>
      <div class="row"><label for="hs-${h.id}">상태</label><select id="hs-${h.id}" data-hstatus="${h.id}">${statusOpts(h.status)}</select>
      <label for="hg-${h.id}">단계</label><select id="hg-${h.id}" data-hstage="${h.id}">${stageOpts(h.stageId)}</select>
      <button class="danger" data-del-h="${h.id}">삭제</button></div>
      <p><strong>연결된 증거 ${evOf(h).length}건</strong></p>
      <ul class="plain">${evOf(h).map((e) => `<li>${esc(e.date)} · ${esc(e.who)}: ${esc(e.quote)}</li>`).join("") || '<li class="muted">없음 — 인터뷰·증거 탭에서 연결하세요</li>'}</ul></article>`).join("");
}
function evView() {
  return `<h2>인터뷰·증거</h2>
  <form class="add" id="f-ev" aria-label="증거 추가">
    <div class="row"><label for="e-date">날짜</label><input type="date" id="e-date" value="${today()}"><label for="e-who">누구에게서</label><select id="e-who">${WHO.map((w) => `<option>${w}</option>`).join("")}</select></div>
    <div class="row"><label for="e-quote">들은 말·관찰한 사실 (가능하면 그대로)</label></div><textarea id="e-quote" required></textarea>
    <fieldset><legend>연결할 가설 (해당하는 것 모두)</legend>${P.hypotheses.map((h) => `<div class="row"><input type="checkbox" id="ec-${h.id}" value="${h.id}"><label for="ec-${h.id}" style="font-weight:400">${esc(h.text)}</label></div>`).join("") || '<span class="muted">가설이 아직 없습니다</span>'}</fieldset>
    <button class="primary">증거 추가</button></form>` +
    [...P.evidence].reverse().map((e) => `<article class="item"><h3>${esc(e.date)} · ${esc(e.who)}</h3><p>${esc(e.quote)}</p>
      <p class="muted">연결된 가설: ${(e.hypothesisIds || []).map((id) => esc((P.hypotheses.find((h) => h.id === id) || {}).text || "(삭제됨)")).join(" / ") || "없음"}</p>
      <button class="danger" data-del-e="${e.id}">삭제</button></article>`).join("");
}
function decView() {
  return `<h2>결정</h2><p class="muted">고른 것과 함께 버린 대안, 이유를 남깁니다.</p>
  <form class="add" id="f-dec" aria-label="결정 추가"><div class="row"><label for="d-date">날짜</label><input type="date" id="d-date" value="${today()}"><label for="d-stage">단계</label><select id="d-stage">${stageOpts(P.currentStage)}</select></div>
    <div class="row"><label for="d-chosen">고른 것</label></div><input type="text" id="d-chosen" required style="width:100%">
    <div class="row"><label for="d-rej">버린 대안</label></div><input type="text" id="d-rej" style="width:100%">
    <div class="row"><label for="d-why">이유</label></div><textarea id="d-why"></textarea><button class="primary">결정 추가</button></form>` +
    [...P.decisions].reverse().map((d) => `<article class="item"><h3>${esc(d.chosen)}</h3><p>${esc(d.date)} · ${esc(stageName(d.stageId))}</p><p>버린 대안: ${esc(d.rejected || "없음")}</p><p>이유: ${esc(d.why || "")}</p><button class="danger" data-del-d="${d.id}">삭제</button></article>`).join("");
}
function stageView() {
  return `<h2>단계·졸업 조건</h2>` + P.stages.map((s, i) => `<section class="item" aria-labelledby="s-${s.id}"><h3 id="s-${s.id}">${i + 1}단계 ${esc(s.name)}</h3>
    <div class="row"><label for="sg-${s.id}">목표</label><input type="text" id="sg-${s.id}" data-goal="${s.id}" value="${esc(s.goal)}" style="flex:1;min-width:240px">
    <button data-cur="${s.id}" ${s.id === P.currentStage ? 'aria-pressed="true"' : 'aria-pressed="false"'}>${s.id === P.currentStage ? "현재 단계" : "현재 단계로 지정"}</button></div>
    <fieldset><legend>졸업 조건</legend>${s.exit.map((e, k) => `<div class="row"><input type="checkbox" id="x-${s.id}-${k}" data-exit="${s.id}:${k}" ${e.done ? "checked" : ""}><label for="x-${s.id}-${k}" style="font-weight:400">${esc(e.text)}</label><button class="danger" data-del-x="${s.id}:${k}">삭제</button></div>`).join("")}
    <div class="row"><label for="nx-${s.id}">조건 추가</label><input type="text" id="nx-${s.id}"><button data-add-x="${s.id}">추가</button></div></fieldset></section>`).join("");
}
const VIEWS = { map: ["지도", mapView], outline: ["개요(낭독용)", outlineView], hyp: ["가설", hypView], ev: ["인터뷰·증거", evView], dec: ["결정", decView], stage: ["단계·졸업조건", stageView] };
function render() {
  const keep = document.activeElement && document.activeElement.id;
  $("#app").innerHTML = summary() + `<nav class="tabs" aria-label="화면 선택">${Object.entries(VIEWS).map(([k, v]) => `<button data-view="${k}" aria-pressed="${k === view}">${v[0]}</button>`).join("")}</nav><div id="view">${VIEWS[view][1]()}</div>`;
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.scrollIntoView({ block: "center" }); el.focus(); } focusId = null; }
  else if (keep) { const el = document.getElementById(keep); if (el) el.focus(); }
}
const app = $("#app");
app.addEventListener("click", (ev) => {
  const t = ev.target.closest("button"); if (!t) return;
  if (t.dataset.view) { view = t.dataset.view; render(); return; }
  if (t.dataset.goto) { view = "hyp"; focusId = "h-" + t.dataset.goto; render(); return; }
  if (t.dataset.delH && confirm("이 가설을 삭제할까요?")) { P.hypotheses = P.hypotheses.filter((h) => h.id !== t.dataset.delH); P.evidence.forEach((e) => (e.hypothesisIds = (e.hypothesisIds || []).filter((x) => x !== t.dataset.delH))); save(); render(); }
  if (t.dataset.delE && confirm("이 증거를 삭제할까요?")) { P.evidence = P.evidence.filter((e) => e.id !== t.dataset.delE); save(); render(); }
  if (t.dataset.delD && confirm("이 결정을 삭제할까요?")) { P.decisions = P.decisions.filter((d) => d.id !== t.dataset.delD); save(); render(); }
  if (t.dataset.cur) { P.currentStage = t.dataset.cur; save(); render(); }
  if (t.dataset.delX) { const [s, k] = t.dataset.delX.split(":"); P.stages[stageIdx(s)].exit.splice(+k, 1); save(); render(); }
  if (t.dataset.addX) { const s = t.dataset.addX, inp = document.getElementById("nx-" + s); if (inp.value.trim()) { P.stages[stageIdx(s)].exit.push({ text: inp.value.trim(), done: false }); save(); focusId = "nx-" + s; render(); } }
});
app.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.dataset.hstatus) { P.hypotheses.find((h) => h.id === t.dataset.hstatus).status = t.value; save(); render(); }
  if (t.dataset.hstage) { P.hypotheses.find((h) => h.id === t.dataset.hstage).stageId = t.value; save(); render(); }
  if (t.dataset.goal) { P.stages[stageIdx(t.dataset.goal)].goal = t.value; save(); }
  if (t.dataset.exit) { const [s, k] = t.dataset.exit.split(":"); P.stages[stageIdx(s)].exit[+k].done = t.checked; save(); render(); }
});
app.addEventListener("submit", (ev) => {
  ev.preventDefault(); const f = ev.target;
  if (f.id === "f-hyp") { P.hypotheses.push({ id: uid("h"), stageId: $("#h-stage").value, text: $("#h-text").value.trim(), status: "unverified" }); }
  if (f.id === "f-ev") { P.evidence.push({ id: uid("e"), date: $("#e-date").value, who: $("#e-who").value, quote: $("#e-quote").value.trim(), hypothesisIds: [...f.querySelectorAll("input[type=checkbox]:checked")].map((c) => c.value) }); }
  if (f.id === "f-dec") { P.decisions.push({ id: uid("d"), date: $("#d-date").value, stageId: $("#d-stage").value, chosen: $("#d-chosen").value.trim(), rejected: $("#d-rej").value.trim(), why: $("#d-why").value.trim() }); }
  save(); render();
});
$("#proj").addEventListener("change", async (e) => { pid = e.target.value; P = await api("/api/projects/" + pid); view = "map"; render(); });
async function clone(from, structureOnly) {
  const name = prompt(structureOnly ? "새 프로젝트 이름" : "복제본 이름", structureOnly ? "" : P.name + " (복제)"); if (!name || !name.trim()) return;
  const r = await api("/api/projects", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: name.trim(), from, mode: structureOnly ? "structure" : "all" }) });
  view = "map"; await loadList(r.id);
}
$("#btn-new").addEventListener("click", () => clone("template", true));
$("#btn-clone").addEventListener("click", () => { const structureOnly = confirm("확인: 구조만 복제(가설·증거·결정은 비움)\n취소: 전체 복제"); clone(pid, structureOnly); });
loadList().catch((e) => { $("#app").textContent = "불러오지 못했습니다: " + e.message; });
</script>
</body>
</html>
